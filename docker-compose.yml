services:
  apexcare-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apexcare-hms-server
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - SPRING_PROFILES_ACTIVE=dev,demo
    volumes:
      - hms-data:/app/data

volumes:
  hms-data:
    driver: local

