name: ApexCare HIS CI Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-desktop-build:
    name: Build & Test Server and Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Compile Backend & Run Integration Tests
        run: ./gradlew :server:test :server:classes --no-daemon

      - name: Compile Desktop App
        run: ./gradlew :desktop:classes --no-daemon

  android-build:
    name: Assemble Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Android Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apexcare-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  web-portal-check:
    name: Verify Web Assets Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Webapp File Structure & HTML Syntax
        run: |
          test -f webapp/index.html
          test -f webapp/login.html
          test -f webapp/patient-portal.html
          test -f webapp/patients.html
          test -f webapp/appointments.html
          test -f webapp/doctors.html
          test -f webapp/billing.html
          test -f webapp/records.html
          test -f webapp/css/style.css
          test -f webapp/js/app.js
          echo "All core HIS web assets validated successfully."