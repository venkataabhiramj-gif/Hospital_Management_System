plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('HMS_ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('HMS_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('HMS_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('HMS_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { value ->
    value != null && !value.isBlank()
}

android {
    namespace 'com.hospital.management.android'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.hospital.management.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}
