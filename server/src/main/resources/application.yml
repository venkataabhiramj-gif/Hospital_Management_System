spring:
  application:
    name: hospital-management-api
  profiles:
    default: dev
  datasource:
    url: ${HMS_DATABASE_URL:jdbc:h2:file:./data/hospital;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${HMS_DATABASE_USERNAME:sa}
    password: ${HMS_DATABASE_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Kolkata
  h2:
    console:
      enabled: false

server:
  port: ${HMS_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

hms:
  bootstrap:
    username: ${HMS_ADMIN_USERNAME:admin}
    password: ${HMS_ADMIN_PASSWORD:}
