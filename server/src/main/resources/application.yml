spring:
  application:
    name: hospital-management-api
  profiles:
    default: dev,demo
  datasource:
    url: ${HMS_DATABASE_URL:jdbc:h2:file:./data/hospital;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${HMS_DATABASE_USERNAME:sa}
    password: ${HMS_DATABASE_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Kolkata
  h2:
    console:
      enabled: false

logging:
  level:
    org.springframework.security: DEBUG

server:
  port: ${PORT:${HMS_SERVER_PORT:8088}}
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  error:
    include-message: always
    include-stacktrace: always

hms:
  bootstrap:
    username: ${HMS_ADMIN_USERNAME:admin}
    password: ${HMS_ADMIN_PASSWORD:DemoAdminPass123!}
  demo:
    staff-password: ${HMS_DEMO_STAFF_PASSWORD:DemoStaffPass123!}
